[package]
name = "walkmark"
version = "0.1.2"
description = "Turn any workflow into polished step-by-step documentation"
authors = ["Walkmark"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "walkmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
reqwest = { version = "0.13", features = [
  "json",
  "http2",
  "charset",
  "rustls",
  "webpki-roots",
  "system-proxy",
], default-features = false }

xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
printpdf = { version = "0.12", default-features = false, features = ["png", "jpeg"] }

base64 = "0.23"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
parking_lot = "0.12"
keyring = "4"
rayon = "1"
dirs = "6"
pulldown-cmark = "0.13"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
rdev = { git = "https://github.com/Narsil/rdev.git", rev = "c77b4e5456301cfa7f2226020f2a58f2f8d77c5d" }

[target.'cfg(target_os = "linux")'.dependencies]
rdev = { git = "https://github.com/Narsil/rdev.git", rev = "c77b4e5456301cfa7f2226020f2a58f2f8d77c5d", features = ["x11"] }

# Only for reading total physical memory, so the local-model list can say what
# this machine can actually run.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Tauri 2.x pulls gtk 0.18 → glib 0.18.5, which is affected by RUSTSEC-2024-0429 /
# GHSA-wrw7-89jp-8q8g. Upstream only fixed glib >= 0.20; gtk3-rs is archived.
# Patch gtk-rs-core 0.18 with the VariantStrIter backport until Tauri moves to gtk4.
# See: https://rustsec.org/advisories/RUSTSEC-2024-0429
[patch.crates-io]
glib = { git = "https://github.com/shiva-manu/gtk-rs-core.git", branch = "0.18-patched" }
glib-sys = { git = "https://github.com/shiva-manu/gtk-rs-core.git", branch = "0.18-patched" }
glib-macros = { git = "https://github.com/shiva-manu/gtk-rs-core.git", branch = "0.18-patched" }
gobject-sys = { git = "https://github.com/shiva-manu/gtk-rs-core.git", branch = "0.18-patched" }
gio-sys = { git = "https://github.com/shiva-manu/gtk-rs-core.git", branch = "0.18-patched" }
