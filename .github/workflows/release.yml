name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
            name: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
            name: macos-x64
          - platform: ubuntu-22.04
            target: ''
            args: ''
            name: linux
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: '--target x86_64-pc-windows-msvc'
            name: windows-x64
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
            args: '--target aarch64-pc-windows-msvc --bundles nsis'
            name: windows-arm64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Steppy v__VERSION__
          releaseBody: |
            See [documentation](https://github.com/e-vicius/steppy/tree/main/docs) for install notes.

            | Platform | File |
            | --- | --- |
            | macOS (Apple Silicon) | `Steppy_*_aarch64.dmg` |
            | macOS (Intel) | `Steppy_*_x64.dmg` |
            | Windows (x64) | `Steppy_*_x64-setup.exe` |
            | Windows (ARM64) | `Steppy_*_arm64-setup.exe` |
            | Linux | `Steppy_*_amd64.AppImage` or `.deb` |
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
